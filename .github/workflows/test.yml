name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step on purpose: the package has no runtime dependencies and
      # the suite uses node:test, so anything that fails here is a code problem
      # rather than a dependency-resolution problem.
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test
